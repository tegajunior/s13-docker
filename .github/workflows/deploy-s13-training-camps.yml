name: Deploy S13 Training Camps

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: s13-training-camps
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy S13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          docker version

      - name: Set image tag from commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          image_tag="${commit_sha: -4}"
          printf 'IMAGE_TAG=%s\n' "$image_tag" >> "$GITHUB_ENV"
          echo "Building the S13 image with tag: $image_tag"

      - name: Build fresh image
        run: |
          set -euo pipefail
          docker build --pull --tag "s13-training-camps:${IMAGE_TAG}" .

      - name: Take down current application
        run: |
          set -euo pipefail
          docker rm --force s13-training-camps 2>/dev/null || true

      - name: Start application with new images
        run: |
          set -euo pipefail
          docker volume create s13-training-camps-data >/dev/null
          docker run --detach \
            --name s13-training-camps \
            --restart unless-stopped \
            --publish 8080:8080 \
            --volume s13-training-camps-data:/data \
            "s13-training-camps:${IMAGE_TAG}"

      - name: Verify deployment health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:8080/health" >/dev/null && \
               curl --fail --silent --show-error "http://127.0.0.1:8080/api/courses" >/dev/null; then
              docker ps --filter name=s13-training-camps
              echo "The S13 Training Camps container is healthy with image tag ${IMAGE_TAG}."
              exit 0
            fi
            sleep 5
          done
          docker ps --all --filter name=s13-training-camps
          docker logs --tail=100 s13-training-camps || true
          exit 1
